name: Release

# Builds unsigned Cortex Max installers for macOS (Apple Silicon) and Windows
# (x64) and attaches them to a GitHub Release.
#
#   Push a tag like v0.6.0  -> builds both installers and publishes a Release.
#   Run manually            -> builds both installers as workflow artifacts only.
#
# The builds are not code-signed. macOS users open the app once from
# System Settings > Privacy & Security; Windows users choose "More info" >
# "Run anyway" in SmartScreen. See README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            pattern: "*.dmg"
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            pattern: "*.exe"
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Restore Cargo cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cargo_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.target }}-

      # No auto-updater artifacts. On macOS, sign ad hoc ("-"): an Apple
      # Silicon bundle must carry at least an ad hoc signature to launch.
      - name: Generate release bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.release.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false,
              "macOS": { "signingIdentity": "-" }
            }
          }
          JSON

      - name: Build sidecars
        shell: bash
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          else
            cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          fi
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build installer
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles "${{ matrix.bundle }}" --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Locate installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          DIR="desktop/src-tauri/target/${TARGET}/release/bundle/${{ matrix.bundle }}"
          FILE=$(find "$DIR" -maxdepth 1 -name '${{ matrix.pattern }}' -type f | head -1)
          if [[ -z "$FILE" ]]; then
            echo "::error::No installer found in $DIR"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-${{ matrix.target }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      - name: Save Cargo cache
        if: steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cortex Max $GITHUB_REF_NAME" \
            --notes "Unsigned builds for macOS (Apple Silicon) and Windows (x64). See the README for first-launch steps."
